[project]
name = "datacatalog"
version = "0.1.0"
description = "Organize data on external drives: checksums, duplicates, quarantine and integrity checks"
readme = "README.md"
requires-python = ">=3.10"
# Runtime uses the Python standard library only - keep it that way.
dependencies = []

[project.scripts]
datacatalog = "datacatalog.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "datacatalog"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
